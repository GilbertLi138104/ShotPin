<svg class="shotpin-logo" viewBox="0 0 240 240" role="img" aria-label="ShotPin 标志：实心图钉与负空间光圈">
    <defs>
      <!-- 用蒙版把光圈“挖”出来：白色保留，黑色镂空 -->
      <mask id="shotpin-cut">
        <rect width="240" height="240" fill="#ffffff"></rect>
        <g fill="#000000">
          <!-- 中心正六边形孔 -->
          <path d="M 116.35 116.68 L 100.27 103.18 L 103.91 82.5 L 123.65 75.32 L 139.73 88.82 L 136.09 109.5 Z"></path>
        </g>
        <!-- 6 道等宽叶片缝：从六边形顶点沿切向甩出，圆头收尾，无缝宽渐变 -->
        <g fill="none" stroke="#000000" stroke-width="2.4" stroke-linecap="round">
          <path d="M 116.35 116.68 L 63.81 122.2"></path>
          <path d="M 100.27 103.18 L 69.21 60.44"></path>
          <path d="M 103.91 82.5 L 125.4 34.24"></path>
          <path d="M 123.65 75.32 L 176.19 69.8"></path>
          <path d="M 139.73 88.82 L 170.79 131.56"></path>
          <path d="M 136.09 109.5 L 114.6 157.76"></path>
        </g>
      </mask>
    </defs>

    <!-- App 图标底板 -->
    <rect width="240" height="240" rx="52" fill="#f7f2ed"></rect>

    <!-- 实心暖橙图钉，光圈部分被镂空 -->
    <path d="M 66.23 130.71 A 64 64 0 1 1 173.77 130.71 L 120 214 Z" fill="#f97316" mask="url(#shotpin-cut)"></path>
  </svg>